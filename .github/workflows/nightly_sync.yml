name: Chronograph Daily Knowledge Graph Update

on:
  schedule:
    # Runs at 17:30 UTC (11:00 PM IST) on Sun, Mon, Wed, Fri
    - cron: '30 17 * * 0,1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Orchestrator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: python orchestrator.py

      - name: Persist scraped_history.txt Ledger to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/scraped_history.txt ]; then
            git add -f data/scraped_history.txt
            git diff --staged --quiet || (git commit -m "chore: update scraped_history.txt ledger [skip ci]" && git push)
          fi