<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <style>
      .cad-grid { stroke: #1a1a20; stroke-width: 0.7; }
      .datum-axis { stroke: #3f3f46; stroke-width: 0.85; stroke-dasharray: 4 4; }
      .chassis-fill { fill: #0d0d12; stroke: #52525b; stroke-width: 1.4; stroke-linejoin: round; }
      .chassis-wire { fill: none; stroke: #71717a; stroke-width: 1.1; stroke-linejoin: round; }
      .cad-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 7.5px;
        font-weight: 800;
        fill: #f4f4f5;
        letter-spacing: 0.12em;
      }
      .cad-dim {
        font-family: 'JetBrains Mono', monospace;
        font-size: 6px;
        fill: #71717a;
        letter-spacing: 0.08em;
      }
      .leader-line {
        stroke: #71717a;
        stroke-width: 0.85;
        stroke-dasharray: 2 2;
        fill: none;
      }
      .leader-dot {
        fill: #e10600;
      }
    </style>
  </defs>

  <!-- 1. TECHNICAL CAD GRID BACKDROP -->
  <g id="grid" class="cad-grid">
    <pattern id="blueprint-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16161a" stroke-width="0.7" />
    </pattern>
    <rect width="1000" height="370" fill="url(#blueprint-grid)" />
    <!-- Datum Reference Planes -->
    <line x1="210" y1="20" x2="210" y2="340" class="datum-axis" />
    <line x1="790" y1="20" x2="790" y2="340" class="datum-axis" />
    <line x1="25" y1="305" x2="975" y2="305" class="datum-axis" />
    <text x="35" y="325" class="cad-dim">REF DATUM: FIA TECHNICAL REGULATION CHASSIS ENVELOPE</text>
    <text x="500" y="325" text-anchor="middle" class="cad-dim">3600mm MAXIMUM WHEELBASE SPECIFICATION</text>
  </g>

  <!-- 2. FRONT WING AND NOSECONE ASSEMBLY -->
  <g id="front-wing-assembly">
    <path d="M 45 300 L 125 300 L 140 255 L 120 215 L 58 220 Z" class="chassis-fill" />
    <path d="M 60 260 L 122 255 L 135 228" class="chassis-wire" />
    <!-- Needle Nose -->
    <path d="M 125 242 L 280 208 L 330 208 L 330 232 L 210 248 Z" class="chassis-fill" />
    <!-- Front Wing Leader & Label -->
    <polyline points="75,230 75,190 95,190" class="leader-line" />
    <circle cx="75" cy="230" r="1.8" class="leader-dot" />
    <text x="100" y="192" class="cad-label">FRONT WING / MAINPLANE</text>
  </g>

  <!-- 3. FRONT WHEEL AND SUSPENSION -->
  <g id="front-suspension-profile">
    <line x1="210" y1="248" x2="160" y2="268" stroke="#71717a" stroke-width="2.5" />
    <line x1="280" y1="222" x2="210" y2="268" stroke="#71717a" stroke-width="2.5" />
    <circle cx="210" cy="258" r="54" fill="#08080a" stroke="#3f3f46" stroke-width="3" />
    <circle id="wheel-rim-front" cx="210" cy="258" r="30" fill="#141418" stroke="#52525b" stroke-width="1.5" />
    <circle cx="210" cy="258" r="7" fill="#e10600" />
  </g>

  <!-- 4. MONOCOQUE, HALO AND AIRBOX INTAKE -->
  <g id="cockpit-halo">
    <path d="M 330 208 L 440 162 L 480 166 L 530 108 L 510 108 L 480 152 Z" class="chassis-fill" />
    <!-- Titanium Halo Arch -->
    <path d="M 430 166 C 470 135, 520 135, 535 175" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- HALO LABEL -->
    <polyline points="470,145 440,120 375,120" class="leader-line" />
    <circle cx="470" cy="145" r="1.8" class="leader-dot" />
    <text x="370" y="122" text-anchor="end" class="cad-label">HALO COCKPIT PROTECTION</text>
    
    <!-- Airbox Spine and Intakes -->
    <path d="M 510 108 L 535 108 L 730 222 L 720 246 L 480 224 Z" class="chassis-fill" />
    
    <!-- AIRBOX INTAKE LABEL -->
    <polyline points="522,106 522,76 545,76" class="leader-line" />
    <circle cx="522" cy="106" r="1.8" class="leader-dot" />
    <text x="550" y="78" class="cad-label">AIRBOX / ROLL HOOP</text>

    <!-- SHARK FIN DORSAL LABEL -->
    <polyline points="635,165 655,135 690,135" class="leader-line" />
    <circle cx="635" cy="165" r="1.8" class="leader-dot" />
    <text x="696" y="137" class="cad-label">SHARK FIN SPINE</text>
  </g>

  <!-- 5. SIDEPOD UNDERCUT AND RADIATOR PROFILE -->
  <g id="sidepod-ramp">
    <path d="M 330 232 C 360 198, 480 194, 675 258 L 720 298 L 290 298 Z" class="chassis-fill" />
    <!-- Louvres -->
    <line x1="520" y1="224" x2="580" y2="244" class="chassis-wire" />
    <line x1="540" y1="234" x2="600" y2="254" class="chassis-wire" />
    <line x1="560" y1="244" x2="620" y2="264" class="chassis-wire" />
    
    <!-- SIDEPOD UNDERCUT LABEL -->
    <polyline points="380,240 380,270 410,270" class="leader-line" />
    <circle cx="380" cy="240" r="1.8" class="leader-dot" />
    <text x="415" y="272" class="cad-label">SIDEPOD UNDERCUT</text>
  </g>

  <!-- 6. GROUND-EFFECT VENTURI FLOOR, PLANK AND DIFFUSER -->
  <g id="floor-underbody">
    <!-- Floor Skid and Edge Wing -->
    <rect id="floor-plank" x="290" y="298" width="430" height="9" fill="#141418" stroke="#3f3f46" stroke-width="1.2" />
    <line x1="315" y1="302" x2="695" y2="302" stroke="#e10600" stroke-width="1.8" stroke-dasharray="8 4" />
    <text x="500" y="318" text-anchor="middle" class="cad-label">VENTURI FLOOR AND SKID BLOCK</text>

    <!-- Upward Diffuser Expansion Ramp -->
    <path id="diffuser-ramp" d="M 720 307 C 760 305, 805 285, 835 265 L 833 275 C 800 295, 755 315, 720 315 Z" class="chassis-fill" />
    
    <!-- DIFFUSER EXIT LABEL -->
    <polyline points="785,295 810,338 845,338" class="leader-line" />
    <circle cx="785" cy="295" r="1.8" class="leader-dot" />
    <text x="850" y="340" class="cad-label">DIFFUSER EXIT RAMP</text>
  </g>

  <!-- 7. REAR WHEEL AND BRAKE ASSEMBLY -->
  <g id="rear-suspension-profile">
    <line x1="720" y1="246" x2="790" y2="258" stroke="#71717a" stroke-width="2.5" />
    <circle cx="790" cy="258" r="56" fill="#08080a" stroke="#3f3f46" stroke-width="3" />
    <circle id="wheel-rim-rear" cx="790" cy="258" r="32" fill="#141418" stroke="#52525b" stroke-width="1.5" />
    <circle cx="790" cy="258" r="7" fill="#e10600" />
  </g>

  <!-- 8. REAR WING, BEAM WING AND ACTIVE DRS -->
  <g id="rear-wing-assembly">
    <!-- Swan-Neck Pylon -->
    <path d="M 720 246 C 730 202, 760 125, 790 104 L 805 104" fill="none" stroke="#71717a" stroke-width="2.5" />
    <!-- Endplate Boundary -->
    <path d="M 790 98 L 898 94 L 878 238 L 816 238 Z" fill="none" stroke="#71717a" stroke-width="1.5" />
    
    <!-- Lower Beam Wing -->
    <path d="M 800 234 L 856 228 L 850 244 Z" class="chassis-fill" />
    <polyline points="852,236 880,236 895,236" class="leader-line" />
    <circle cx="852" cy="236" r="1.8" class="leader-dot" />
    <text x="900" y="238" class="cad-label">BEAM WING</text>

    <!-- Static Mainplane Profile -->
    <path d="M 804 128 L 880 118 L 876 136 L 810 144 Z" class="chassis-fill" />
    
    <!-- ACTIVE DRS FLAP -->
    <g id="active-flap">
      <path d="M 816 118 L 886 106 L 882 116 L 818 126 Z" fill="#e10600" stroke="#ffffff" stroke-width="1.2" filter="drop-shadow(0 0 5px rgba(225, 6, 0, 0.75))" />
      <circle cx="816" cy="118" r="2.2" fill="#ffffff" />
    </g>
    
    <!-- REAR WING / DRS LABEL -->
    <polyline points="855,100 855,60 880,60" class="leader-line" />
    <circle cx="855" cy="100" r="1.8" class="leader-dot" />
    <text x="886" y="62" class="cad-label">REAR WING / ACTIVE DRS FLAP</text>
  </g>
</svg>